name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: backoffice_test
          POSTGRES_USER: backoffice
          POSTGRES_PASSWORD: backoffice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backoffice" --health-interval 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/backoffice_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Business rules (SQL) and web security tests on PostgreSQL
        run: mvn -B verify
      - name: Business queries run on the demo year
        run: psql postgresql://backoffice:backoffice@localhost:5432/backoffice_test -v ON_ERROR_STOP=1 -f sql/requetes_metier.sql > /dev/null
      - name: BPMN and MCD files are well-formed
        run: |
          for f in docs/bpmn/*.bpmn docs/bpmn/*.svg docs/figures/mcd.svg; do python3 -c "import sys, xml.dom.minidom as m; m.parse(sys.argv[1])" "$f"; done
      - name: Docker image builds
        run: docker build -t aeria-backoffice .
