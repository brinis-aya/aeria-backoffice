<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Connexion')}"></head>
<body>
<main class="login">
    <div class="card">
        <h1>Aeria back-office</h1>
        <p class="sub">Gestion du parc de capteurs et de la maintenance</p>
        <div class="flash erreur" th:if="${param.error}" role="alert">Identifiant ou mot de passe incorrect.</div>
        <div class="flash ok" th:if="${param.deconnecte}" role="status">Vous êtes déconnecté.</div>
        <form class="stack" method="post" th:action="@{/login}">
            <label>Identifiant <input name="username" autocomplete="username" required autofocus></label>
            <label>Mot de passe <input name="password" type="password" autocomplete="current-password" required></label>
            <button class="primary" type="submit">Se connecter</button>
        </form>
        <p class="hint">Démonstration : <b>responsable</b> / demo-responsable, ou un technicien
            (<b>clefevre</b>, <b>imorel</b>, <b>lnguyen</b>…) / demo-technicien.</p>
    </div>
</main>
</body>
</html>
